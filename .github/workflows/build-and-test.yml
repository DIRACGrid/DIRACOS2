name: Build and test installer
on:
  push:
    # Only build for pushes to branches
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - main
  schedule:
    - cron:  '6 2 * * *'
  workflow_dispatch:

# A new push to the same branch/PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-installer:
    name: Build installer
    if: github.repository == 'DIRACGrid/DIRACOS2'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target_arch: linux-64
            os: ubuntu-latest
          - target_arch: linux-aarch64
            os: ubuntu-24.04-arm
          - target_arch: osx-arm64
            os: macos-15
          - target_arch: osx-64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          cache: true
      - name: Build installer
        run: pixi run build-installer
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.target_arch }}
          path: DIRACOS-*.sh

  get-info:
    name: Create environment.yaml
    if: github.repository == 'DIRACGrid/DIRACOS2'
    needs: build-installer
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_arch: ["linux-64"]
    steps:
      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-${{ matrix.target_arch }}
      - name: Generate environment.yaml
        # The installer only ships micromamba (no conda), so the environment
        # is exported via "micromamba list" in conda env export format, which
        # is what scripts/make_release.py parses for the release notes.
        run: |
          bash DIRACOS-*.sh
          source diracos/diracosrc
          "$DIRACOS/bin/python" - <<'EOF'
          import json
          import os
          import subprocess

          prefix = os.environ["DIRACOS"]
          packages = json.loads(
              subprocess.check_output(
                  [f"{prefix}/bin/micromamba", "list", "--prefix", prefix, "--json"],
                  text=True,
              )
          )["packages"]

          channels = []
          for package in packages:
              if package["channel"] not in channels:
                  channels.append(package["channel"])

          with open("environment.yaml", "w") as env_file:
              env_file.write(f"name: {prefix}\n")
              env_file.write("channels:\n")
              for channel in channels:
                  env_file.write(f"  - {channel}\n")
              env_file.write("dependencies:\n")
              for package in packages:
                  env_file.write(
                      f"  - {package['name']}={package['version']}"
                      f"={package['build_string']}\n"
                  )
              env_file.write(f"prefix: {prefix}\n")
          EOF
      - name: Upload environment.yaml
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: environment-yaml-${{ matrix.target_arch }}
          path: |
            environment.yaml

  release-notes:
    name: Show release notes and diff
    if: github.repository == 'DIRACGrid/DIRACOS2'
    needs: get-info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          cache: true
          environments: release
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Create release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pixi run -e release release-notes \
            --token="${GH_TOKEN}" \
            --artifacts-dir="${PWD}/artifacts" \
            > release-notes.md
          cat release-notes.md
      - name: Upload release-notes.md
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: |
            release-notes.md

  basic-tests:
    name: Basic tests
    if: github.repository == 'DIRACGrid/DIRACOS2'
    needs: build-installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 tests: run against varous EL versions with the linux-64 installer
          - os: ubuntu-latest
            docker_image: almalinux:8
            installer: installer-linux-64
          - os: ubuntu-latest
            docker_image: almalinux:9
            installer: installer-linux-64
          - os: ubuntu-latest
            docker_image: almalinux:10
            installer: installer-linux-64
          # ARM tests: run only AlmaLinux 9 tests with the linux-aarch64 installer
          - os: ubuntu-24.04-arm
            docker_image: almalinux:9
            installer: installer-linux-aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.installer }}
      - name: Run tests
        env:
          DOCKER_IMAGE: ${{ matrix.docker_image }}
        run: scripts/run_basic_tests.sh "$DOCKER_IMAGE" DIRACOS-*.sh

  macos-64-tests:
    name: macOS (x86_64) tests
    if: github.repository == 'DIRACGrid/DIRACOS2'
    needs: build-installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-osx-64
      - name: Run tests
        run: |
           bash DIRACOS-*.sh
           set -x
           source diracos/diracosrc
           pip install DIRAC

  macos-tests:
    name: macOS (arm64) tests
    if: github.repository == 'DIRACGrid/DIRACOS2'
    needs: build-installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-osx-arm64
      - name: Run tests
        run: |
           bash DIRACOS-*.sh
           set -x
           source diracos/diracosrc
           pip install DIRAC

  integration-tests-client-and-server:
    name: Integration tests (Py3 server)
    if: github.repository == 'DIRACGrid/DIRACOS2'
    needs: build-installer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dirac-branch:
          - rel-v8r0
          - rel-v9r0
          - integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-linux-64
      - name: Prepare environment
        env:
          DIRAC_BRANCH: ${{ matrix.dirac-branch }}
        run: |
          pip install typer pyyaml gitpython packaging
          git clone https://github.com/DIRACGrid/DIRAC.git -b "${DIRAC_BRANCH}" DIRACRepo
      - name: Run tests
        run: |
          DIRACOS_TARBALL_PATH=$(echo ${PWD}/DIRACOS-*.sh)
          echo "DIRACOS_TARBALL_PATH is ${DIRACOS_TARBALL_PATH}"
          cd DIRACRepo
          ./integration_tests.py create \
            "DIRACOS_TARBALL_PATH=${DIRACOS_TARBALL_PATH}"
